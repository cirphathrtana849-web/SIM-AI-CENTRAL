
name: Build SIM AI CENTRAL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check project files
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html

      - name: Install dependencies
        run: npm install

      - name: Build web project
        run: npm run build --if-present

      - name: Check web files
        run: test -f www/index.html

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check Capacitor Android
        run: |
          npx cap --version
          npm ls @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIM-AI-CENTRAL-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
